<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вася</title>
<!-- Which of the widget's two windows this document is. Set before the body
     renders, because the two surfaces lay out differently and a flash of the
     wrong one is visible on a transparent window. -->
<script>document.documentElement.dataset.surface =
  new URLSearchParams(location.search).get("surface") || "pet";</script>
<link rel="stylesheet" href="/tokens.css">
<script src="/theme.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html{background:transparent}
body{background:transparent;font:var(--t-body)/1.45 var(--font-ui);color:var(--ink);
display:inline-flex;flex-direction:column;align-items:flex-end;
justify-content:flex-end;padding:8px;-webkit-user-select:none;user-select:none}

/* The pet surface: nothing but the character, centred in a window whose size
   is a constant. Everything the robot SAYS lives in the other window, so this
   document has no measurable content and never asks to be resized — which is
   the whole reason the head cannot move any more. */
html[data-surface="pet"] body{display:flex;align-items:center;
justify-content:center;width:100vw;height:100vh;padding:0}
html[data-surface="pet"] #dialog{display:none}

/* The character is the drag handle; everything else must stay clickable.
   NOT `-webkit-app-region: drag` — that is an Electron extension and
   WKWebView ignores it, which is why the pet could not be moved at all. The
   real drag is in the script below. */
/* The bubble and the consent answers hug the right edge whatever their width:
   as a plain block a 300px bubble made the column 300 wide and its children
   sat at the LEFT. */
#mascot{display:flex;flex-direction:column;align-items:flex-end}
.mascot-body{cursor:grab;filter:drop-shadow(0 3px 8px rgba(0,0,0,.28));touch-action:none}
/* Слово о состоянии под фигуркой. Окно питомца прозрачное и лежит поверх
   ЧУЖОГО рабочего стола — без подложки текст читается через раз, поэтому
   пилюля на `--panel`. Ширина окна 104px (`desktop.PET_SIZE`), фигурка 72:
   строка обязана в остаток влезать, а не растягивать окно, которое по
   сценарию не меняет размер. */
.pet-word{font-size:var(--t-note);color:var(--ink);background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r-pill);
  padding:1px 6px;margin-top:3px;max-width:100%;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.mascot-body:active{cursor:grabbing}
/* Дыхание живёт ОДИН раз — в `mascot.js`, вместе с остальными состояниями
   персонажа, и оттуда же приходит на обе поверхности. Здесь была вторая
   копия `@keyframes vb-breathe` с другой амплитудой (−3px против −2.5px) и
   зашитой кривой вместо токенной; и она не просто дублировала, а ЛОМАЛА
   правило паузы: селектор `.mascot-body svg` специфичнее, чем
   `.vb-paused{animation:none}`, поэтому на паузе питомец продолжал дышать —
   при том что принцип 3 визии требует, чтобы пауза выглядела как отсутствие
   (найдено аудитом 2026-09-01). */

/* The bubble. Fixed width and a capped, scrollable height: a long answer grew
   it into a half-screen column of two-word lines, and the whole window jumped
   as it appeared and expired. Text is left-aligned because centred prose is
   hard to read past one line. */
.bubble{background:var(--panel);border:1px solid var(--border-strong);
border-radius:var(--r-card);padding:9px 12px;margin-bottom:8px;
width:300px;max-height:230px;overflow-y:auto;text-align:left;
box-shadow:0 6px 20px rgba(0,0,0,.18);word-break:break-word;cursor:pointer}
.bubble b{font-weight:600}
.bubble code{font-family:var(--font-data);font-size:var(--t-cap);
background:var(--panel-2);padding:.1em .35em;border-radius:4px}
.bubble .dismiss{display:block;margin-top:6px;font-size:var(--t-note);color:var(--muted)}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:flex-end}
/* Таймер-бар согласия (пак: 4px, --warn, дренаж слева направо, линейно).
   У питомца те же три кнопки, и молчание у них тоже значит отказ. */
.deadline{display:flex;align-items:center;gap:6px;margin-top:6px}
.drain{flex:1;height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.drain>i{display:block;height:100%;width:100%;background:var(--warn);
  transform-origin:left;transform:scaleX(var(--left,1));
  transition:transform 1s linear}
.secs{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){ .drain{display:none} }
.btn{font:600 var(--t-cap) var(--font-ui);border-radius:var(--r-control);padding:6px 10px;
border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);border-color:var(--border-strong);color:var(--ink)}
.btn.dangerous{background:var(--panel);border-color:var(--danger);color:var(--danger)}

/* The dialogue. Session-scoped and nothing more: the turns live in this page,
   the context lives in the robot's brain, and closing the pet forgets the
   view — which is what keeps it a window onto the brain rather than the
   messenger the product refuses to become (vision, «Не мессенджер»). */
.dialog{background:var(--panel);border:1px solid var(--border-strong);
border-radius:var(--r-card);box-shadow:0 8px 26px rgba(0,0,0,.22);
width:320px;margin-bottom:8px;display:none;overflow:hidden}
.dialog.on{display:block}
.dialog .head{display:flex;align-items:center;gap:8px;padding:8px 10px;
border-bottom:1px solid var(--border);font-size:var(--t-cap);color:var(--muted)}
.dialog .head .grow{margin-left:auto}
.dialog .head .who{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--muted)}
.stat{display:flex;gap:10px;flex-wrap:wrap;padding:7px 10px;font-size:var(--t-note);
color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel-2)}

.media{margin-top:6px}
.media img,.media video{max-width:100%;border-radius:8px;display:block}
.media audio{width:100%}
.media a{display:inline-block;margin-top:4px;font-size:var(--t-cap);color:var(--accent)}
.dialog .head button{background:none;border:0;color:var(--accent);
font:600 var(--t-cap) var(--font-ui);cursor:pointer;padding:2px 4px}
.turns{max-height:240px;overflow-y:auto;padding:8px 10px;
-webkit-user-select:text;user-select:text}
/* Feed lines, not bubbles. The pack is explicit: «Чат: пузырей нет — это
   консоль, не мессенджер (анти-vision §6): реплики как строки ленты с
   ролью-лейблом». Bubbles were the messenger the product refuses to be, and
   they arrived here by habit rather than by decision. */
.turn{display:flex;gap:8px;padding:5px 0;line-height:1.45;
border-bottom:1px solid var(--border);word-break:break-word}
.turn:last-child{border-bottom:0}
.turn .who{color:var(--muted);flex:none;min-width:44px;
font-size:var(--t-note);padding-top:2px}
.turn .what{flex:1;min-width:0}
.turn.me .who{color:var(--accent)}
.turn.sys .what{color:var(--muted);font-size:var(--t-cap)}
.turns .empty{color:var(--muted);font-size:var(--t-cap)}
.ask{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border)}
/* Только СВОЁ: раскладка в строке и разрешение выделять текст в окне, где
   выделение по умолчанию снято ради перетаскивания. Внешний вид контрола —
   общий, из `tokens.css` (V-8). */
.ask input{flex:1;padding:7px 9px;-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 10px 8px}
.chips button{font:var(--t-cap) var(--font-ui);color:var(--ink);background:var(--panel-2);
border:1px solid var(--border);border-radius:999px;padding:4px 9px;cursor:pointer}
.chips button:hover{background:var(--accent-weak)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="dialog" id="dialog"></div>
<div id="mascot"></div>
<script src="/mascot.js"></script>
<script>
const el = document.getElementById("mascot");
const dlg = document.getElementById("dialog");
const native = window.webkit && window.webkit.messageHandlers
  && window.webkit.messageHandlers.vb;

/* Which window this is. `pet` draws the character and nothing else; `side`
   draws everything the robot says. They are separate windows because a single
   resizable one moved the character every time it grew, four reports running —
   see the note at the top of desktop.py. */
const IS_PET = document.documentElement.dataset.surface === "pet";

/* Моушен-слой персонажа приходит из `mascot.js` и до 2026-09-01 на этих
   страницах НЕ применялся вовсе: `mascotStyles()` вызывается внутри
   `renderMascot()`, которым пользуется панель, а виджет строит разметку сам.
   Единственной анимацией головы было локальное правило `.mascot-body svg`,
   которое ничего не знало о состоянии — поэтому на паузе питомец продолжал
   дышать, а мигание, пульс запроса и ветка reduced-motion не работали здесь
   никогда. Стили инжектятся один раз при загрузке; дальше состояние решают
   классы `vb-*`, включая `.vb-paused{animation:none}`. */
mascotStyles();

/* The id comes from the bridge, not from here. A page-local one was
   regenerated on every reload while the feed — which is server-side —
   survived, so the owner kept their visible history and the robot answered
   "это новая сессия". The brain keeps the thread; the bridge names it. */
let session = null;
let busy = false;

async function ensureSession(){
  if (session) return session;
  try{ session = (await (await fetch("/api/mascot/session")).json()).session; }
  catch(e){}
  return session;
}

function esc(x){
  const d = document.createElement("div");
  d.textContent = String(x == null ? "" : x);
  return d.innerHTML;
}

/* The robot answers in Markdown and the bubble showed `**Система:**` raw.
   Escape FIRST, then format the escaped text — so a reply containing markup
   stays a reply and can never become script. */
function fmt(text){
  return esc(text)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
}

/* The COMPANION window hugs what is drawn: a fixed frame clipped the dialogue,
   and every empty pixel of an oversized transparent window swallows a click
   meant for the desktop behind it.

   The pet window is never measured and never resized. That is not an
   optimisation — it is the fix for «он не должен менять место вообще при
   кликах». */
let lastSize = "";
function fitWindow(){
  if (IS_PET || !native) return;
  const w = Math.ceil(document.body.scrollWidth) + 4;
  const h = Math.ceil(document.body.scrollHeight) + 4;
  const key = w + "x" + h;
  if (key === lastSize) return;
  lastSize = key;
  native.postMessage({type:"resize", w, h});
}

/* Tell the window whether it has anything to show. Hidden means alpha 0 and
   click-through, not ordered out — see `_Bridge._reveal`. Size first, then
   reveal, so it is never briefly visible in the old place. */
function syncSide(){
  if (IS_PET || !native) return;
  const show = dialogOpen() || el.innerHTML.trim() !== "";
  if (show) fitWindow();
  native.postMessage({type:"side", show});
}

/* A click on the character reaches the other window through the native side:
   two documents cannot see each other's DOM. */
function requestToggle(){
  if (IS_PET){
    if (native) native.postMessage({type:"toggle"});
    return;
  }
  toggleDialog();
}
window.vbToggle = () => { if (!IS_PET) toggleDialog(); };

// ─── the dialogue ──────────────────────────────────────────────────────────

function dialogOpen(){ return dlg.classList.contains("on"); }

async function toggleDialog(force){
  const open = force === undefined ? !dialogOpen() : force;
  dlg.classList.toggle("on", open);
  painted = "";                      // the bubble hides behind the dialogue
  if (!open){ dlg.innerHTML = ""; await tick(); syncSide(); return; }
  await ensureSession();
  await renderDialog();
  const input = dlg.querySelector("#ask");
  if (input) input.focus();
}

/* One stream. A reply, an event and a notification are all the robot
   communicating with its owner; splitting them across three surfaces is what
   made the widget feel like three half-features. Ordering is by arrival. */
let stream = [];
let seen = new Set();
let status = {};

function mediaOf(item){
  // The robot names a file; the bridge serves it. The page never holds the
  // robot's token and nothing is published outside the tailnet.
  if (item.media && item.media.name){
    return {url: "/api/robot/media/" + encodeURIComponent(item.media.name),
            type: item.media.type || "file"};
  }
  if (item.media && item.media.url) return item.media;
  // The robot sends text today; a bare media URL inside it is still media.
  const m = String(item.text || "").match(/https?:\/\/\S+/);
  if (!m) return null;
  const url = m[0].replace(/[),.]+$/, "");
  const ext = url.split("?")[0].split(".").pop().toLowerCase();
  if (["png","jpg","jpeg","gif","webp","heic"].includes(ext)) return {url, type:"image"};
  if (["mp4","mov","webm","m4v"].includes(ext)) return {url, type:"video"};
  if (["mp3","m4a","wav","ogg","aac"].includes(ext)) return {url, type:"audio"};
  return {url, type:"link"};
}

function mediaHtml(media){
  if (!media) return "";
  // URL присылает РОБОТ, и он уезжает в `href`/`src` — то есть в позицию
  // атрибута, где текстовый экранировщик пропускает кавычку (A-38).
  const u = vbEscAttr(media.url);
  const open = `<a href="${u}" target="_blank" rel="noreferrer">открыть в браузере</a>`;
  if (media.type === "image") return `<div class="media"><img src="${u}" alt="">${open}</div>`;
  if (media.type === "video") return `<div class="media"><video src="${u}" controls preload="metadata"></video>${open}</div>`;
  if (media.type === "audio") return `<div class="media"><audio src="${u}" controls></audio>${open}</div>`;
  if (media.type === "file") return `<div class="media"><a href="${u}" target="_blank" rel="noreferrer">скачать файл</a></div>`;
  return `<div class="media">${open}</div>`;
}

async function pullStream(){
  try{
    const d = await (await fetch("/api/mascot/stream")).json();
    for (const it of (d.items || [])){
      const key = (it.ts || "") + "|" + (it.text || "");
      if (seen.has(key)) continue;
      seen.add(key);
      stream.push({who: "Вася", text: it.text, kind: it.kind || "event",
                   media: mediaOf(it)});
    }
  } catch(e){}
}

async function renderDialog(){
  let quick = [];
  try{ quick = (await (await fetch("/api/mascot/actions")).json()).actions || []; }
  catch(e){}
  await pullStream();

  const rows = stream.length
    ? stream.map(t => {
        const mine = t.who === "Вы";
        const cls = mine ? "me" : (t.kind && t.kind !== "chat" ? "sys" : "bot");
        return `<div class="turn ${cls}"><span class="who">${esc(t.who)}</span>`+
          `<span class="what">${mine ? esc(t.text) : fmt(t.text)}`+
          mediaHtml(t.media) + `</span></div>`;
      }).join("")
    : `<div class="empty">Здесь всё, что говорит робот: ответы, события, уведомления. Спросите его о чём-нибудь — контекст разговора живёт у его мозга.</div>`;

  const online = status.online;
  const bits = [];
  if (status.uptime_h != null) bits.push(`аптайм ${status.uptime_h} ч`);
  if (status.orchestrator) bits.push(`мозг ${esc(status.orchestrator)}`);
  if (status.version) bits.push(esc(String(status.version).split("+")[0]));

  dlg.innerHTML =
    `<div class="head"><span class="dot ${online ? "on" : "off"}"></span>`+
    `<span class="who">${esc(status.name || "Робот")}</span>`+
    `<span>${online ? "в сети" : esc(status.reason || "не на связи")}</span>`+
    `<span class="grow"></span>`+
    `<button id="newDlg">Новый</button><button id="closeDlg">Закрыть</button></div>`+
    (bits.length ? `<div class="stat">${bits.join(" · ")}</div>` : "")+
    `<div class="turns" id="turns">${rows}</div>`+
    // Only in an empty conversation: three buttons above the input on every
    // turn is a nudge that stops being an offer and becomes furniture.
    ((quick.length && !stream.length) ? `<div class="chips">${quick.map((q,i)=>
        `<button data-q="${i}">${esc(q)}</button>`).join("")}</div>` : "")+
    `<div class="ask"><input id="ask" placeholder="${busy ? "Робот думает…" : "Сказать роботу…"}"`+
    `${busy ? " disabled" : ""} autocomplete="off">`+
    `<button class="btn ghost" id="panelBtn">Панель</button></div>`;

  dlg.querySelector("#newDlg").onclick = async () => {
    try{
      session = (await (await fetch("/api/mascot/session",
        {method:"POST"})).json()).session;
    } catch(e){}
    stream = []; seen = new Set();
    renderDialog();
  };
  dlg.querySelector("#closeDlg").onclick = () => toggleDialog(false);
  dlg.querySelector("#panelBtn").onclick = () => {
    if (native) native.postMessage({type:"panel"});
    toggleDialog(false);
  };
  dlg.querySelectorAll("[data-q]").forEach(b => {
    b.onclick = () => send(quick[+b.dataset.q]);
  });
  const input = dlg.querySelector("#ask");
  input.onkeydown = (e) => {
    if (e.key === "Enter" && e.target.value.trim()) send(e.target.value.trim());
    if (e.key === "Escape") toggleDialog(false);
  };

  const feed = dlg.querySelector("#turns");
  feed.scrollTop = feed.scrollHeight;
  syncSide();
}

async function send(text){
  if (busy) return;
  busy = true;
  await ensureSession();
  stream.push({who: "Вы", text, kind: "chat"});
  await renderDialog();
  try{
    const r = await (await fetch("/api/robot/chat", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, session})})).json();
    const answer = r.ok ? r.reply : (r.error || "не ответил");
    stream.push({who: "Вася", text: answer, kind: "chat",
                 media: mediaOf({text: answer})});
  } catch(e){
    stream.push({who: "Вася", text: "мост не ответил", kind: "chat"});
  }
  busy = false;
  if (dialogOpen()) await renderDialog();
  tick();
}

// ─── the character ─────────────────────────────────────────────────────────

// Что сказать владельцу, если его клик опоздал или не дошёл. До 2026-09-02
// эта ветка была `catch(e){}`: питомец молча съедал и «запрос истёк», и
// «мост не ответил» — владелец нажимал «Разрешить» и не узнавал ничего
// (A-10, и тот же класс проглоченной ошибки, что A-36).
let lateNote = null, lateAt = 0;
const LATE_NOTE_MS = 6000;

async function decide(id, decision){
  try{
    const r = await fetch("/api/consent/decide", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, decision})});
    if (!r.ok){
      let why = "Запрос уже решён с другой поверхности.";
      // Пустой catch здесь законен: запасная строка уже стоит,
      // и разобрать тело — уточнение, а не условие ответа.
      try{ why = (await r.json()).error || why; } catch(e){}
      lateNote = why.charAt(0).toUpperCase() + why.slice(1) + ".";
      lateAt = Date.now();
    }
  } catch(e){
    lateNote = "Мост не ответил — решение не отправлено.";
    lateAt = Date.now();
  }
  tick();
}

async function dismiss(){
  try{ await fetch("/api/mascot/dismiss", {method:"POST"}); } catch(e){}
  tick();
}

/* Dragging. The page owns it because WKWebView swallows the mouse events the
   window would otherwise use, and Electron's `-webkit-app-region` does not
   exist here. */
let dragging = null;
function armDrag(){
  const body = el.querySelector(".mascot-body");
  if (!body) return;
  body.addEventListener("pointerdown", (e) => {
    dragging = {x: e.screenX, y: e.screenY, moved: 0};
    body.setPointerCapture(e.pointerId);
  });
  body.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.screenX - dragging.x, dy = e.screenY - dragging.y;
    if (!dx && !dy) return;
    dragging.x = e.screenX; dragging.y = e.screenY;
    dragging.moved += Math.abs(dx) + Math.abs(dy);
    if (native) native.postMessage({type:"drag", dx, dy});
  });
  body.addEventListener("pointerup", (e) => {
    const wasDrag = dragging && dragging.moved > 4;
    dragging = null;
    body.releasePointerCapture(e.pointerId);
    // A click is a press that did not travel: dragging must not open anything,
    // and a drag persists the new position ONCE — on release, not per pixel.
    if (wasDrag){
      if (native) native.postMessage({type:"drop"});
    } else {
      requestToggle();
    }
  });
}

/* Repaint only when something actually changed.
   Rewriting `innerHTML` on every tick destroyed and rebuilt the character a
   second at a time: a click never completed, because `pointerdown` landed on
   one element and `pointerup` arrived after the next repaint had replaced it.
   It is also what made the widget look like it was flickering. `says_left_s`
   is deliberately excluded from the key — it changes every tick by design. */
let painted = "";
function paint(snap, force){
  // The pet's key holds only what the FACE shows. Anything the robot says
  // belongs to the other window, so a notification arriving no longer
  // redraws the character at all.
  const key = JSON.stringify(IS_PET
    ? [snap.state, snap.skin]
    : [snap.state, snap.says, snap.actionable, snap.request_id, dialogOpen()]);
  // Never repaint mid-drag: replacing the element under the pointer cancels
  // the gesture.
  if (!force && (dragging || key === painted)) return;
  painted = key;

  if (IS_PET){
    // Поправка пака дословно: «он не заменяет собой текст: рядом с ним
    // всегда слово о состоянии». В окне питомца не было ни слова, ни даже
    // `title`: разметка строилась здесь, минуя `renderMascot()`. А по той же
    // доктрине на паузе и офлайне персонаж НЕПОДВИЖЕН — то есть ровно в двух
    // состояниях из пяти окно не сообщало вообще ничего (V-6).
    const s = MASCOT_STATES[snap.state] || MASCOT_STATES.idle;
    el.innerHTML =
      `<div class="mascot-body" title="${vbEscAttr(s.label)}">` +
      `${mascotSvg(snap.state, 72, snap.skin)}</div>` +
      `<div class="pet-word">${vbEsc(s.label)}</div>`;
    armDrag();
    return;                       // no measuring, no resize, no movement
  }

  if (lateNote && Date.now() - lateAt > LATE_NOTE_MS) lateNote = null;
  if (lateNote) snap = Object.assign({}, snap,
                                     {says: lateNote, actionable: false});
  const showBubble = snap.says && !dialogOpen();
  el.innerHTML =
    (showBubble ? `<div class="bubble" id="bubble">${fmt(snap.says)}`+
      (snap.actionable ? "" : `<span class="dismiss">нажмите, чтобы убрать</span>`)+
      `</div>` : "") +
    ((snap.actionable && !dialogOpen()) ? `<div class="actions">`+
      `<button class="btn primary" data-d="allow">Разрешить</button>`+
      `<button class="btn ghost" data-d="allow_grant">Такие — 15 мин</button>`+
      `<button class="btn dangerous" data-d="deny">Отклонить</button></div>`+
      deadlineHtml(snap) : "");

  el.querySelectorAll("[data-d]").forEach(b => {
    b.onclick = () => decide(snap.request_id, b.dataset.d);
  });
  const bubble = el.querySelector("#bubble");
  // A consent summary must not be dismissable — it is a question, not news.
  if (bubble && !snap.actionable) bubble.onclick = dismiss;
  syncSide();
}

function deadlineHtml(snap){
  // Молчание — отказ по умолчанию, и до 2026-09-02 об этом не говорила ни
  // одна поверхность: владелец видел три кнопки без единого признака, что
  // бездействие — тоже ответ (A-9).
  const full = snap.ask_timeout_s || 0, left = snap.asks_left_s;
  if (!full || left == null) return "";
  const pct = Math.max(0, Math.min(100, 100 * left / full));
  return `<div class="deadline"><div class="drain" aria-hidden="true">`+
    `<i style="--left:${pct/100}"></i></div>`+
    `<span class="secs">${left > 0 ? Math.ceil(left) + " с" : "истекло"}</span></div>`;
}

async function tick(){
  try{
    paint(await (await fetch("/api/mascot")).json());
  } catch(e){
    // The bridge went away. Say so rather than freezing on the last mood — a
    // cheerful mascot over a dead bridge is the exact lie this project spends
    // its whole design refusing.
    paint({state:"offline", says:"мост не отвечает"});
  }
}

async function pullStatus(){
  try{
    const s = await (await fetch("/api/robot/status")).json();
    status = {name: s.name, online: s.online, reason: s.reason,
              version: s.version, orchestrator: s.orchestrator,
              uptime_h: s.uptime_s != null ? Math.round(s.uptime_s / 3600) : null};
  } catch(e){}
}

if (native) native.postMessage({type:"hello",
  surface: document.documentElement.dataset.surface});
tick();
setInterval(tick, 1000);
// Only the companion needs the robot's status line and the feed; the pet page
// draws a face and nothing else.
if (!IS_PET){
  pullStatus();
  setInterval(pullStatus, 30000);
  // While the widget is open the feed stays live, but only redraws when a new
  // item actually arrived — a redraw would take the focus out of the input.
  setInterval(async () => {
    if (!dialogOpen() || busy) return;
    const before = stream.length;
    await pullStream();
    if (stream.length !== before) await renderDialog();
  }, 3000);
}
</script>
