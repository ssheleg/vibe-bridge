<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вася</title>
<style>
/* The floating window's page. Transparent on purpose: the native panel behind
   it is borderless and clear, so anything opaque here would draw a grey box on
   the owner's desktop. */
:root{--panel:#fff;--ink:#1a1f2b;--muted:#5b6472;--border:#e6e9ef;
--border-strong:#d7dce4;--accent:#2f6feb;--accent-ink:#fff;--ok:#1a7f37;
--warn:#9a6700;--danger:#d1242f;--r-control:6px;--r-card:10px;
--font-ui:-apple-system,"SF Pro","Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--panel:#161b24;
--ink:#e8ecf3;--muted:#8a93a6;--border:#232a36;--border-strong:#2c3441;
--accent:#4b8bff;--accent-ink:#0f1218;--ok:#3fb960;--warn:#d9a93f;--danger:#e5534b}}
*{box-sizing:border-box;margin:0}
/* No height:100% — the window sizes to the body and the body would size to
   the window, so it could never shrink back after the menu closed. */
html{background:transparent}
body{background:transparent}
body{font:13px/1.45 var(--font-ui);color:var(--ink);
display:inline-flex;flex-direction:column;align-items:flex-end;
justify-content:flex-end;padding:8px;-webkit-user-select:none;user-select:none}
/* The character is the drag handle; everything else must stay clickable.
   NOT `-webkit-app-region: drag` — that is an Electron extension and WKWebView
   ignores it, which is why the pet could not be moved at all. The real drag is
   in the script below. */
.mascot-body{cursor:grab;filter:drop-shadow(0 3px 8px rgba(0,0,0,.28));touch-action:none}
.mascot-body:active{cursor:grabbing}
/* Idle motion: a slow breath so the character reads as alive rather than
   frozen. The style pack's rule is that motion degrades to calm, so it stops
   entirely under prefers-reduced-motion — and it is the ONLY idle motion,
   because a mascot that fidgets is a mascot that gets closed. */
@keyframes vb-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mascot-body svg{animation:vb-breathe 4.5s ease-in-out infinite}
.mascot-bubble{background:var(--panel);border:1px solid var(--border-strong);
border-radius:var(--r-card);padding:8px 12px;margin-bottom:8px;max-width:100%;
box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;word-break:break-word}
.mascot-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
/* The quick menu: opened by clicking the character. Small on purpose — the
   panel is where everything lives; this is for the two or three things worth
   doing without switching windows. */
.menu{background:var(--panel);border:1px solid var(--border-strong);
border-radius:var(--r-card);box-shadow:0 8px 26px rgba(0,0,0,.22);
padding:6px;margin-bottom:8px;min-width:210px;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
color:var(--ink);font:13px var(--font-ui);padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--border)}
.menu .sep{height:1px;background:var(--border);margin:5px 2px}
.menu input{width:100%;font:13px var(--font-ui);padding:7px 9px;color:var(--ink);
background:var(--panel);border:1px solid var(--border-strong);border-radius:6px}
.btn{font:600 12px var(--font-ui);border-radius:var(--r-control);padding:6px 10px;
border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);border-color:var(--border-strong);color:var(--ink)}
.btn.dangerous{background:var(--panel);border-color:var(--danger);color:var(--danger)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="menu" id="menu"></div>
<div id="mascot"></div>
<script src="/mascot.js"></script>
<script>
const el = document.getElementById("mascot");
const menuEl = document.getElementById("menu");
const native = window.webkit && window.webkit.messageHandlers
  && window.webkit.messageHandlers.vb;

/* Dragging. The page owns it because WKWebView swallows the mouse events the
   window would otherwise use, and Electron's `-webkit-app-region` does not
   exist here. */
let dragging = null;
function armDrag(){
  const body = el.querySelector(".mascot-body");
  if (!body) return;
  body.addEventListener("pointerdown", (e) => {
    dragging = {x: e.screenX, y: e.screenY, moved: 0};
    body.setPointerCapture(e.pointerId);
  });
  body.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.screenX - dragging.x, dy = e.screenY - dragging.y;
    if (!dx && !dy) return;
    dragging.x = e.screenX; dragging.y = e.screenY;
    dragging.moved += Math.abs(dx) + Math.abs(dy);
    if (native) native.postMessage({type:"drag", dx, dy});
  });
  body.addEventListener("pointerup", (e) => {
    const wasDrag = dragging && dragging.moved > 4;
    dragging = null;
    body.releasePointerCapture(e.pointerId);
    // A click is a press that did not travel: dragging must not open the menu.
    if (!wasDrag) toggleMenu();
  });
}

async function toggleMenu(force){
  const open = force === undefined ? !menuEl.classList.contains("on") : force;
  menuEl.classList.toggle("on", open);
  if (!open) { menuEl.innerHTML = ""; fitWindow(); return; }
  let quick = [];
  try{ quick = (await (await fetch("/api/mascot/actions")).json()).actions || []; }
  catch(e){}
  menuEl.innerHTML =
    quick.map((q,i)=>`<button data-say="${i}">${escText(q)}</button>`).join("") +
    (quick.length ? `<div class="sep"></div>` : "") +
    `<input id="ask" placeholder="Сказать роботу…" autocomplete="off">` +
    `<div class="sep"></div>` +
    `<button data-act="panel">Открыть панель</button>` +
    `<button data-act="pause">Пауза / снять паузу</button>`;
  menuEl.querySelectorAll("[data-say]").forEach(b=>{
    b.onclick = () => sendToRobot(quick[+b.dataset.say]);
  });
  menuEl.querySelector("#ask").onkeydown = (e) => {
    if (e.key === "Enter" && e.target.value.trim()) sendToRobot(e.target.value.trim());
    if (e.key === "Escape") toggleMenu(false);
  };
  menuEl.querySelector('[data-act="panel"]').onclick = () => {
    if (native) native.postMessage({type:"panel"});
    toggleMenu(false);
  };
  menuEl.querySelector('[data-act="pause"]').onclick = async () => {
    try{ await fetch("/api/pause", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:"{}"}); } catch(e){}
    toggleMenu(false); tick();
  };
  fitWindow();
  menuEl.querySelector("#ask").focus();
}

/* The window hugs what is drawn: a fixed frame clipped the menu, and every
   empty pixel of an oversized transparent window swallows a click meant for
   the desktop behind it. */
let lastSize = "";
function fitWindow(){
  if (!native) return;
  const w = Math.ceil(document.body.scrollWidth) + 4;
  const h = Math.ceil(document.body.scrollHeight) + 4;
  const key = w + "x" + h;
  if (key === lastSize) return;
  lastSize = key;
  native.postMessage({type:"resize", w, h});
}

function escText(x){
  const d = document.createElement("div");
  d.textContent = String(x == null ? "" : x);
  return d.innerHTML;
}

async function sendToRobot(text){
  toggleMenu(false);
  try{
    await fetch("/api/robot/chat", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text})});
  } catch(e){}
  tick();                       // the reply arrives through the mascot itself
}

async function decide(id, decision){
  try{
    await fetch("/api/consent/decide", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, decision})});
  } catch(e){}
  tick();
}

async function tick(){
  try{
    const snap = await (await fetch("/api/mascot")).json();
    renderMascot(el, snap, {size: 72, answerable: true, onDecide: decide});
    armDrag();
    fitWindow();
  } catch(e){
    // The bridge went away. Say so rather than freezing on the last mood —
    // a cheerful mascot over a dead bridge is the exact lie this project
    // spends its whole design refusing.
    renderMascot(el, {state:"offline", says:"мост не отвечает"}, {size:72});
    fitWindow();
  }
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
